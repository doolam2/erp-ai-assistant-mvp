    <h1>처방전 등록</h1><span class="sub">버전 v1 자동 시작</span>
    <div class="actions"><a class="btn btn-outline" href="recipes.html">취소</a><button class="btn btn-outline">임시 저장</button><button class="btn btn-primary" onclick="location.href='recipes.html'">저장</button></div>

  <div class="row grid-64">
    <section class="panel"><div class="panel-head"><h2>기본 정보</h2><span class="sub"><b class="t-neg">*</b> 필수 입력</span></div>
      <div class="form-grid"><div class="field"><label>처방전 ID</label><input class="ctl" readonly value="R-신규 (자동 발번)"></div><div class="field"><label>대상 품목 <b>*</b></label><select class="ctl"><option>신규 품목</option><option>두부 500g (신규)</option><option>기존 품목 개정</option></select></div><div class="field"><label>배치 기준 <b>*</b></label><input class="ctl" type="text" placeholder="예) 1,000모"></div><div class="field span2"><label>원료 구성 <b>*</b></label><textarea class="ctl" style="height:88px;padding:10px 14px" placeholder="원료 · 비율(%) · 로트 지정 방식 (행 추가)"></textarea></div><div class="field span2"><label>공정 파라미터</label><textarea class="ctl" style="height:88px;padding:10px 14px" placeholder="응고 온도·시간·압력 등"></textarea></div><div class="field"><label>개정 결재선</label><input class="ctl" readonly value="연구소장 → 공장장"></div></div>
    </section>
    <section class="panel"><div class="panel-head"><h2>저장 시 자동 처리</h2></div><div style="display:flex;gap:10px;margin-bottom:12px"><i style="width:8px;height:8px;border-radius:2px;background:var(--brand);flex-shrink:0;margin-top:4px"></i><div><b style="font-size:11px">배합 계산</b><p style="font-size:10px;color:var(--g08);margin-top:3px">비율 합 100% 검증 + 투입량 자동 산출</p></div></div><div style="display:flex;gap:10px;margin-bottom:12px"><i style="width:8px;height:8px;border-radius:2px;background:var(--brand);flex-shrink:0;margin-top:4px"></i><div><b style="font-size:11px">생산 연동</b><p style="font-size:10px;color:var(--g08);margin-top:3px">승인 시 작업 지시의 자재 소요에 반영</p></div></div><div style="display:flex;gap:10px;margin-bottom:12px"><i style="width:8px;height:8px;border-radius:2px;background:var(--brand);flex-shrink:0;margin-top:4px"></i><div><b style="font-size:11px">버전 이력</b><p style="font-size:10px;color:var(--g08);margin-top:3px">개정마다 v+1, 관능 결과 기록</p></div></div></section>
