<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>스무스 스크롤</title>
<link rel="stylesheet" href="shared.css">
<style>
  section { min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:1rem; }
  h2 { font-size:clamp(2.5rem,7vw,5rem); letter-spacing:-.02em; }
  section:nth-child(even) { background:#1a1a1a; }
  .note { color:var(--dim); }
  #toggle { position:fixed; bottom:1.2rem; right:1.2rem; z-index:100; font:inherit; padding:.6rem 1.4rem; border-radius:99px; border:1px solid var(--fg); background:rgba(17,17,17,.6); color:var(--fg); cursor:pointer; }
  #toggle.on { background:var(--accent); border-color:var(--accent); }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">스무스 스크롤 (Lenis) — 우하단 버튼으로 켜고 끄면서 차이를 느껴보세요</span></div>
<section><h2>Scroll Down</h2><p class="note">지금은 Lenis 스무스 스크롤이 켜져 있습니다</p></section>
<section><h2>Momentum</h2><p class="note">스크롤을 멈춰도 관성으로 미끄러집니다</p></section>
<section><h2>Weight</h2><p class="note">끄면 브라우저 기본 스크롤의 뚝뚝 끊기는 느낌과 비교됩니다</p></section>
<section><h2>The End</h2></section>
<button id="toggle" class="on">Lenis ON</button>
<script src="https://unpkg.com/lenis@1.3.15/dist/lenis.min.js"></script>
<script>
let lenis = new Lenis({ lerp: 0.09 });
let on = true, rafId;
function raf(t){ lenis.raf(t); rafId = requestAnimationFrame(raf); }
rafId = requestAnimationFrame(raf);
const btn = document.getElementById('toggle');
btn.addEventListener('click', () => {
  on = !on;
  btn.textContent = on ? 'Lenis ON' : 'Lenis OFF';
  btn.classList.toggle('on', on);
  if (on) { lenis = new Lenis({ lerp: 0.09 }); rafId = requestAnimationFrame(raf); }
  else { lenis.destroy(); cancelAnimationFrame(rafId); }
});
</script>
</body>
</html>
