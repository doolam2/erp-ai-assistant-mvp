<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>스크롤 줌</title>
<link rel="stylesheet" href="shared.css">
<style>
  .intro { height:60vh; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  .stage { height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
  .zoom-text { font-size:clamp(3rem,10vw,8rem); font-weight:700; letter-spacing:-.03em; will-change:transform,opacity; }
  .next {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#e14f2a; opacity:0; will-change:opacity;
  }
  .next h2 { font-size:clamp(2rem,6vw,4.5rem); }
  .outro { height:60vh; display:flex; align-items:center; justify-content:center; color:var(--dim); }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">스크롤 줌 — 텍스트 속으로 빨려 들어가며 다음 씬 전환</span></div>
<div class="intro">↓ 스크롤</div>
<div class="stage" id="stage">
  <h1 class="zoom-text" id="zoomText">ENTER</h1>
  <div class="next" id="next"><h2>Welcome Inside</h2></div>
</div>
<div class="outro">scale 1 → 30 + 페이드로 씬을 전환했습니다</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const tl = gsap.timeline({
  scrollTrigger:{ trigger:'#stage', start:'top top', end:'+=1800', pin:true, scrub:true }
});
tl.to('#zoomText', { scale:30, opacity:0, ease:'power2.in', duration:2 })
  .to('#next', { opacity:1, duration:1 }, '-=0.8');
</script>
</body>
</html>
