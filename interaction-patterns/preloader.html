<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>프리로더</title>
<link rel="stylesheet" href="shared.css">
<style>
  #loader {
    position:fixed; inset:0; background:#0b0b0b; z-index:1500;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:2rem 3rem; will-change:transform;
  }
  #count { font-size:clamp(4rem,15vw,11rem); font-weight:700; letter-spacing:-.04em; line-height:1; }
  #loader small { color:var(--dim); padding-bottom:1.2rem; letter-spacing:.2em; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5rem; }
  main h1 { font-size:clamp(2.5rem,8vw,6rem); letter-spacing:-.03em; }
  main p { color:var(--dim); }
  button { font:inherit; padding:.7rem 1.8rem; border-radius:99px; border:1.5px solid var(--fg); background:transparent; color:var(--fg); cursor:pointer; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">프리로더 — 카운터가 차오른 뒤 커튼이 걷힙니다</span></div>
<div id="loader"><div id="count">0</div><small>LOADING</small></div>
<main>
  <h1>Welcome</h1>
  <p>프리로더가 걷히면서 본 콘텐츠가 등장합니다</p>
  <button id="replay">다시 재생</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
const counter = { v: 0 };
function play(){
  gsap.set('#loader', { y:0, display:'flex' });
  counter.v = 0;
  const tl = gsap.timeline();
  tl.to(counter, {                       // 실무에선 실제 에셋 로드 진행률과 연결
      v:100, duration:1.8, ease:'power2.inOut',
      onUpdate:() => document.getElementById('count').textContent = Math.round(counter.v)
    })
    .to('#loader', { y:'-100%', duration:1, ease:'expo.inOut' }, '+=0.25')
    .from('main h1', { y:60, opacity:0, duration:1, ease:'expo.out' }, '-=0.35')
    .from('main p',  { y:30, opacity:0, duration:.8, ease:'expo.out' }, '-=0.7');
}
play();
document.getElementById('replay').onclick = play;
</script>
</body>
</html>
