<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>호리즌탈 스크롤</title>
<link rel="stylesheet" href="shared.css">
<style>
  .intro, .outro { height:60vh; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  .h-wrap { overflow:hidden; }
  .track { display:flex; width:max-content; }
  .panel {
    width:70vw; height:100vh; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:1rem;
  }
  .panel h2 { font-size:clamp(3rem,9vw,7rem); letter-spacing:-.03em; }
  .panel:nth-child(1){ background:#111; } .panel:nth-child(2){ background:#e14f2a; }
  .panel:nth-child(3){ background:#1c355e; } .panel:nth-child(4){ background:#f5f2ec; color:#111; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">호리즌탈 스크롤 — 세로로 스크롤하면 패널이 옆으로 흐릅니다</span></div>
<div class="intro">↓ 스크롤</div>
<div class="h-wrap" id="hwrap">
  <div class="track" id="track">
    <div class="panel"><h2>One</h2></div>
    <div class="panel"><h2>Two</h2></div>
    <div class="panel"><h2>Three</h2></div>
    <div class="panel"><h2>Four</h2></div>
  </div>
</div>
<div class="outro">가로 구간이 끝나면 다시 세로 스크롤</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const track = document.getElementById('track');
gsap.to(track, {
  x: () => -(track.scrollWidth - innerWidth),
  ease:'none',
  scrollTrigger:{
    trigger:'#hwrap', start:'top top',
    end:() => '+=' + (track.scrollWidth - innerWidth),
    pin:true, scrub:1, invalidateOnRefresh:true
  }
});
</script>
</body>
</html>
