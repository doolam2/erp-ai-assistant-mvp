<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>중력 낙하 바운스</title>
<link rel="stylesheet" href="shared.css">
<style>
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.5rem; overflow:hidden; }
  h1 { font-size:clamp(2.4rem,8vw,6rem); font-weight:800; letter-spacing:-.01em; }
  h1 span { display:inline-block; will-change:transform; }
  button { font:inherit; padding:.7rem 1.8rem; border-radius:99px; border:1.5px solid var(--fg); background:transparent; color:var(--fg); cursor:pointer; }
  .note { color:var(--dim); font-size:.9rem; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">중력 낙하 바운스 — 글자들이 떨어져 튀며 자리 잡습니다</span></div>
<main>
  <h1 id="d">GRAVITY WINS</h1>
  <p class="note">bounce.out 이징 + 글자마다 무작위 낙하 시차·미세 회전</p>
  <button id="replay">다시 떨어뜨리기</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
const d = document.getElementById('d');
d.innerHTML = [...d.textContent].map(c => c === ' ' ? ' ' : `<span>${c}</span>`).join('');
const chars = d.querySelectorAll('span');
function play(){
  gsap.fromTo(chars,
    { y:-innerHeight * .7, opacity:0, rotation:() => gsap.utils.random(-30,30) },
    { y:0, opacity:1, rotation:0,
      duration:1.4, ease:'bounce.out',
      stagger:{ each:.06, from:'random' } });
}
play();
document.getElementById('replay').onclick = play;
</script>
</body>
</html>
