<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>텍스트 스크램블</title>
<link rel="stylesheet" href="shared.css">
<style>
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.5rem; }
  h1 { font-size:clamp(2rem,7vw,5rem); font-family:"SF Mono",Menlo,monospace; letter-spacing:0; min-height:1.3em; }
  nav { display:flex; gap:2rem; }
  nav a { color:var(--fg); text-decoration:none; font-family:Menlo,monospace; font-size:1.1rem; }
  .note { color:var(--dim); font-size:.9rem; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">텍스트 스크램블 — 자동 순환 + 메뉴는 호버 시 스크램블</span></div>
<main>
  <h1 id="target">DESIGNER</h1>
  <nav>
    <a href="#" class="scr">WORK</a><a href="#" class="scr">ABOUT</a><a href="#" class="scr">CONTACT</a>
  </nav>
  <p class="note">지글거리다 원래 글자로 정착하는 고전 패턴</p>
</main>
<script>
const CHARS = '!<>-_\\/[]{}—=+*^?#________';
function scramble(el, next){
  const from = el.textContent, len = Math.max(from.length, next.length);
  const queue = Array.from({length:len}, (_,i) => ({
    from: from[i] || '', to: next[i] || '',
    start: Math.floor(Math.random()*30), end: Math.floor(Math.random()*30)+20
  }));
  let frame = 0;
  cancelAnimationFrame(el._raf);
  (function update(){
    let out = '', done = 0;
    queue.forEach(q => {
      if (frame >= q.end) { done++; out += q.to; }
      else if (frame >= q.start) out += `<span style="opacity:.5">${CHARS[Math.floor(Math.random()*CHARS.length)]}</span>`;
      else out += q.from;
    });
    el.innerHTML = out;
    if (done < queue.length) { frame++; el._raf = requestAnimationFrame(update); }
  })();
}
const words = ['DESIGNER','DEVELOPER','DIRECTOR','DREAMER'];
let wi = 0;
const target = document.getElementById('target');
setInterval(() => scramble(target, words[++wi % words.length]), 2600);
document.querySelectorAll('.scr').forEach(a => {
  const orig = a.textContent;
  a.addEventListener('mouseenter', () => scramble(a, orig));
});
</script>
</body>
</html>
