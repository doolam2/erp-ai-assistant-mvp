<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>텍스트 마스크 비디오</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { background:#000; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.2rem; }
  .knock { position:relative; background:#000; overflow:hidden; }
  .knock h1 {
    margin:0; color:#fff; background:#000;
    font-size:clamp(3.4rem,13vw,11rem); font-weight:900; letter-spacing:-.03em; line-height:1.05;
    text-align:center; text-transform:uppercase;
  }
  /* 검정 배경 + 흰 글자 위에 darken 블렌드 → 흰 글자 안에서만 영상이 보임 */
  .knock video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; mix-blend-mode:darken; }
  .note { color:rgba(245,242,236,.45); font-size:.9rem; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">텍스트 마스크 비디오 — 글자 안에서 영상이 재생됩니다</span></div>
<main>
  <div class="knock">
    <h1>BLOOM<br>SEASON</h1>
    <video autoplay muted loop playsinline src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video>
  </div>
  <p class="note">검정 배경 + 흰 글자 + 영상 mix-blend-mode:darken 조합. 굵은 폰트일수록 잘 보임</p>
</main>
<script>
const v = document.querySelector('video');
v.play().catch(() => addEventListener('pointerdown', () => v.play(), { once:true }));
</script>
</body>
</html>
