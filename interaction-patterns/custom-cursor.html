<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>커스텀 커서</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { cursor:none; }
  a, .card { cursor:none; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3rem; }
  nav { display:flex; gap:2.5rem; font-size:1.4rem; }
  nav a { color:var(--fg); text-decoration:none; }
  .card {
    width:300px; height:200px; border-radius:12px; background:#222;
    display:flex; align-items:center; justify-content:center; color:var(--dim);
  }
  #dot {
    position:fixed; top:0; left:0; width:8px; height:8px; border-radius:50%;
    background:var(--accent); pointer-events:none; z-index:3000;
    transform:translate(-50%,-50%);
  }
  #ring {
    position:fixed; top:0; left:0; width:36px; height:36px; border-radius:50%;
    border:1.5px solid var(--accent); pointer-events:none; z-index:3000;
    transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    font-size:0; color:#fff; transition:width .3s, height .3s, background .3s, font-size .3s;
  }
  #ring.hover { width:60px; height:60px; background:rgba(225,79,42,.15); }
  #ring.view { width:80px; height:80px; background:var(--accent); font-size:.75rem; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">커스텀 커서 — 링크 위에서 커지고, 카드 위에선 VIEW로 변함</span></div>
<main>
  <nav>
    <a href="#">Work</a><a href="#">About</a><a href="#">Contact</a>
  </nav>
  <div class="card">이 카드 위에 올려보세요</div>
</main>
<div id="ring">VIEW</div>
<div id="dot"></div>
<script>
const dot = document.getElementById('dot'), ring = document.getElementById('ring');
let mx = innerWidth/2, my = innerHeight/2, rx = mx, ry = my;
addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
(function loop(){
  dot.style.left = mx+'px'; dot.style.top = my+'px';
  rx += (mx-rx)*0.15; ry += (my-ry)*0.15;          // 링은 lerp로 살짝 늦게 따라옴
  ring.style.left = rx+'px'; ring.style.top = ry+'px';
  requestAnimationFrame(loop);
})();
document.querySelectorAll('a').forEach(a => {
  a.addEventListener('mouseenter', () => ring.classList.add('hover'));
  a.addEventListener('mouseleave', () => ring.classList.remove('hover'));
});
const card = document.querySelector('.card');
card.addEventListener('mouseenter', () => ring.classList.add('view'));
card.addEventListener('mouseleave', () => ring.classList.remove('view'));
</script>
</body>
</html>
