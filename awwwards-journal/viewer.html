<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review — Awwwards Journal</title>
<style>
  :root { --bg:#111; --fg:#f5f2ec; --accent:#e14f2a; --dim:rgba(245,242,236,.55); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:"Helvetica Neue",Helvetica,"Apple SD Gothic Neo",sans-serif; }
  .top { position:sticky; top:0; background:rgba(17,17,17,.85); backdrop-filter:blur(10px); padding:.9rem 1.5rem; border-bottom:1px solid rgba(255,255,255,.08); }
  .top a { color:var(--fg); text-decoration:none; font-size:.9rem; }
  .top a:hover { color:var(--accent); }
  article { max-width:820px; margin:0 auto; padding:3rem 1.5rem 6rem; line-height:1.8; }
  article h1 { font-size:2.2rem; letter-spacing:-.02em; line-height:1.2; margin-bottom:1.2rem; }
  article h2 { font-size:1.4rem; margin:2.6rem 0 1rem; padding-bottom:.5rem; border-bottom:1px solid rgba(255,255,255,.12); }
  article h3 { font-size:1.1rem; margin:1.8rem 0 .7rem; color:var(--accent); }
  article p, article li { color:rgba(245,242,236,.85); font-size:.98rem; }
  article ul, article ol { padding-left:1.4rem; margin:.6rem 0 1rem; }
  article li { margin:.35rem 0; }
  article blockquote { border-left:3px solid var(--accent); padding:.6rem 0 .6rem 1.2rem; margin:1rem 0; color:var(--fg); background:rgba(225,79,42,.06); border-radius:0 8px 8px 0; }
  article strong { color:var(--fg); }
  article code { font-family:Menlo,monospace; font-size:.85em; background:rgba(255,255,255,.08); padding:.12em .4em; border-radius:4px; }
  article img { max-width:100%; border-radius:10px; border:1px solid rgba(255,255,255,.1); margin:.6rem 0; }
  article a { color:var(--accent); }
  article table { border-collapse:collapse; margin:1rem 0; width:100%; }
  article th, article td { border:1px solid rgba(255,255,255,.12); padding:.5rem .7rem; text-align:left; vertical-align:top; }
  #err { padding:4rem 1.5rem; text-align:center; color:var(--dim); }
</style>
</head>
<body>
<div class="top"><a href="index.html">← 저널 목록</a></div>
<article id="content"></article>
<div id="err" hidden>리뷰를 불러올 수 없습니다.</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const folder = new URLSearchParams(location.search).get('e');
if (!folder || folder.includes('..') || folder.includes('/')) {
  document.getElementById('err').hidden = false;
} else {
  fetch(`${folder}/review.md`)
    .then(r => { if (!r.ok) throw 0; return r.text(); })
    .then(md => {
      let html = marked.parse(md);
      // 상대 이미지 경로를 엔트리 폴더 기준으로 보정
      html = html.replace(/src="(?!https?:\/\/)([^"]+)"/g, `src="${folder}/$1"`);
      document.getElementById('content').innerHTML = html;
      const h1 = document.querySelector('#content h1');
      if (h1) document.title = h1.textContent + ' — Awwwards Journal';
    })
    .catch(() => document.getElementById('err').hidden = false);
}
</script>
</body>
</html>
