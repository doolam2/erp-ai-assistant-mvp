<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>라인 패럴랙스</title>
<link rel="stylesheet" href="shared.css">
<style>
  .spacer { height:75vh; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  section { min-height:130vh; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; }
  .lp { font-size:clamp(2.6rem,9vw,7rem); font-weight:800; letter-spacing:-.03em; line-height:1.06;
    text-transform:uppercase; will-change:transform; }
  .lp:nth-child(2) { color:transparent; -webkit-text-stroke:1.5px var(--fg); }
  .lp:nth-child(3) { color:var(--accent); }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">라인 패럴랙스 — 줄마다 다른 속도로 흘러 어긋났다 모입니다</span></div>
<div class="spacer">↓ 스크롤</div>
<section id="sec">
  <div class="lp" data-speed="-1">Different</div>
  <div class="lp" data-speed="0.35">Lines</div>
  <div class="lp" data-speed="1.6">Same Story</div>
</section>
<div class="spacer">섹션 중앙에서 정렬(오프셋 0)되도록 진행도를 -1~1로 매핑한 것이 포인트</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
document.querySelectorAll('.lp').forEach(el => {
  const sp = parseFloat(el.dataset.speed);
  gsap.fromTo(el, { y: -160 * sp }, {
    y: 160 * sp, ease: 'none',
    scrollTrigger: { trigger: '#sec', start: 'top bottom', end: 'bottom top', scrub: true }
  });
});
</script>
</body>
</html>
