<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>폴드 갤러리</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { background:#efefef; color:#111; overflow:hidden; }
  .bar { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
    padding:.9rem 1.4rem 0 8.5rem; font-size:.85rem; color:#999; z-index:10; }
  .bar b { color:#111; font-weight:700; }
  #stage { position:fixed; inset:0; perspective:1600px; }
  .fold {
    position:absolute; left:50%; top:50%; width:380px; height:260px;
    margin:-130px 0 0 -190px; transform-style:preserve-3d; will-change:transform;
  }
  .fold .half {
    position:absolute; top:0; width:50%; height:100%; overflow:hidden;
    transform-style:preserve-3d; background:#111;
  }
  .fold .L { left:0; transform-origin:right center; }
  .fold .R { right:0; transform-origin:left center; }
  .fold img { position:absolute; top:0; width:200%; height:100%; object-fit:cover; }
  .fold .L img { left:0; }
  .fold .R img { right:0; }
  .hint { position:fixed; bottom:1.4rem; width:100%; text-align:center; color:#a9a49c; font-size:.8rem; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">폴드 갤러리 — 병풍처럼 접힌 카드가 휠에 따라 흐르며 접혔다 펴집니다</span><a class="ref" href="https://www.etienne.studio/" target="_blank" rel="noopener">레퍼런스 ↗</a></div>
<div class="bar"><b>Fold Gallery</b><span>Work — Archive — Info</span></div>
<div id="stage"></div>
<p class="hint">중앙에 오면 활짝 펴지고, 밀려날수록 깊게 접힙니다. 접힌 안쪽 면은 거울상</p>
<script>
const IDS = [1015,1025,1036,1043,1050,1062,1069,1080];
const N = IDS.length;
const stage = document.getElementById('stage');
const folds = IDS.map(id => {
  const el = document.createElement('div');
  el.className = 'fold';
  const src = `https://picsum.photos/id/${id}/760/520`;
  el.innerHTML =
    `<div class="half L"><img src="${src}" draggable="false"></div>` +
    `<div class="half R"><img src="${src}" draggable="false"></div>`;
  stage.appendChild(el);
  return { el, L: el.querySelector('.L'), R: el.querySelector('.R') };
});
const GAP = 560;                     // 아이템 간격
const TOTAL = N * GAP;
let off = 0, vel = 0;
addEventListener('wheel', e => { vel += e.deltaY * .5; }, { passive: true });
(function loop(){
  off = (off + vel) % TOTAL; if (off < 0) off += TOTAL;
  vel *= .93;
  folds.forEach((f, i) => {
    let x = (i * GAP - off + TOTAL * 1.5) % TOTAL - TOTAL / 2;
    const t = Math.min(1, Math.abs(x) / (GAP * 1.4));   // 중앙거리 0~1
    const foldDeg = 12 + t * 58;                        // 중앙 12° → 가장자리 70°
    // 행 전체의 3D 곡률: 옆 카드는 안쪽으로 꺾이고(rotateY) 뒤로 물러남(translateZ)
    const bendDeg = -x * 0.045;                         // 원통 밴드처럼 휘어짐
    const z = -(x * x) / 2200;
    f.el.style.transform = `translateX(${x}px) translateZ(${z}px) rotateY(${bendDeg}deg)`;
    f.el.style.zIndex = Math.round(100 - t * 90);
    f.el.style.opacity = t > .98 ? 0 : 1;               // 화면 밖 여분 숨김
    f.L.style.transform = `rotateY(${ foldDeg}deg)`;    // 왼면은 안으로
    f.R.style.transform = `rotateY(${-foldDeg}deg)`;    // 오른면도 안으로 → 병풍
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
