<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>아치 캐러셀</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { background:#faf9f6; color:#111; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  .card {
    position:absolute; left:50%; top:24%; width:190px; aspect-ratio:1;
    margin-left:-95px; will-change:transform;
    background:#000; overflow:hidden;
  }
  .card img { width:100%; height:100%; object-fit:cover; display:block; }
  .menu {
    position:fixed; left:50%; top:57%; transform:translateX(-50%);
    display:flex; gap:1.4rem; font-size:.9rem; align-items:baseline;
  }
  .menu b { font-weight:700; margin-right:1rem; }
  .menu span { color:#8a857c; }
  .hint { position:fixed; bottom:1.4rem; width:100%; text-align:center; color:#a9a49c; font-size:.8rem; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">아치 캐러셀 — 휠을 굴리면 이미지 띠가 아치를 따라 흐릅니다</span><a class="ref" href="https://voku.studio/" target="_blank" rel="noopener">레퍼런스 ↗</a></div>
<div id="stage"></div>
<div class="menu"><b>Arc.Studio™</b><span id="label">Project One.</span></div>
<p class="hint">휠 스크롤 · 아치 꼭대기(중앙)에 온 작품의 이름이 아래에 표시됩니다</p>
<script>
const NAMES = ['Ex Nihilo Paris.','Fleur Narcotique.','Premios Goya.','The Weekend.','FC Barcelona.','Night Vision.','Portrait Study.','Red Nebula.','Ear to Ear.','Blue Field.'];
const IDS = [1015,1025,1036,1043,1050,1062,1069,1080,110,119];
const N = IDS.length;
const stage = document.getElementById('stage');
const cards = IDS.map((id, i) => {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<img src="https://picsum.photos/id/${id}/300/300?grayscale" draggable="false">`;
  stage.appendChild(el);
  return el;
});
const GAP = 214;                    // 카드 간격(px)
const TOTAL = N * GAP;
const R = 1500;                     // 아치 반경 — 작을수록 많이 휨
let off = 0, vel = 0;
addEventListener('wheel', e => { vel += e.deltaY * .45; }, { passive: true });
const label = document.getElementById('label');
(function loop(){
  off = (off + vel) % TOTAL; if (off < 0) off += TOTAL;
  vel *= .93;
  let best = 0, bestD = 1e9;
  cards.forEach((el, i) => {
    // 중앙 기준 순환 좌표(-TOTAL/2 ~ TOTAL/2)
    let x = (i * GAP - off + TOTAL * 1.5) % TOTAL - TOTAL / 2;
    const y = (x * x) / (2 * R);            // 포물선 아치(중앙이 꼭대기)
    // 커버플로우 스케일: 중앙 1.55배 → 가장자리 0.55배
    const t = Math.min(1, Math.abs(x) / 700);
    const s = 1.55 - t * 1.0;
    el.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    el.style.zIndex = Math.round(1000 - y); // 위(중앙)일수록 앞
    const d = Math.abs(x);
    if (d < bestD){ bestD = d; best = i; }
  });
  label.textContent = NAMES[best];
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
