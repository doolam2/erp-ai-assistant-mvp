<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 맑은물에</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/style.css?v=5">
<script>try{localStorage.setItem('sw_theme','malgeunmule')}catch(e){}</script>
<script src="assets/theme.js"></script>
<style>
body.login-page{min-height:100vh;background:#111;overflow:hidden}

/* ── 배경 롤링 (5장 크로스페이드) ── */
.bg-roll{position:fixed;inset:0;z-index:0}
.bg-roll img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease}
.bg-roll img.on{opacity:1}

/* ── 좌측 로그인 카드 ── */
.lg-card{position:absolute;z-index:1;left:8vw;top:50%;transform:translateY(-50%);
  width:500px;max-width:calc(100vw - 32px);background:var(--surface);border-radius:16px;
  padding:44px 50px 36px;box-shadow:0 24px 64px rgba(0,0,0,.28)}
.lg-logo{text-align:center}
.lg-logo img{height:66px;display:inline-block}
.lg-sub{text-align:center;font-size:12px;color:var(--g05);margin:12px 0 24px}
.lg-card label{display:block;font-size:12px;font-weight:500;color:var(--g08);margin:16px 0 8px}
.lg-card input,.lg-card select{width:100%;height:44px;border:1px solid var(--g03);border-radius:8px;padding:0 14px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--ink)}
.lg-card input:focus{outline:none;border-color:var(--brand);border-width:1.5px}
.lg-row{display:flex;justify-content:space-between;align-items:center;margin:16px 0 20px;font-size:12px}
.lg-row a{color:var(--brand);font-weight:500}
.lg-btn{width:100%;height:48px;background:var(--brand);color:#fff;border:0;border-radius:8px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .15s}
.lg-btn:hover{background:var(--brand-2)}
.lg-btn[disabled]{opacity:.75;cursor:default}
.lg-help{text-align:center;font-size:11px;color:var(--g05);margin-top:20px}
.lg-foot{position:fixed;z-index:1;left:0;right:0;bottom:18px;text-align:center;font-size:10px;color:rgba(255,255,255,.75)}

/* 오류 셰이크 */
@keyframes lgshake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lg-card.shake{animation:lgshake .4s ease}
.lg-card.shake{transform:translateY(-50%)}
.lg-card input.err{border-color:var(--neg)}

@media (max-width:960px){
  .lg-card{left:50%;transform:translate(-50%,-50%);padding:36px 26px 30px}
  .lg-card.shake{transform:translate(-50%,-50%)}
}
</style>
</head>
<body class="login-page">

  <!-- 배경 롤링 -->
  <div class="bg-roll" id="bgRoll">
    <img src="assets/img/login_roll1.jpg" class="on" alt="">
    <img src="assets/img/login_roll2.jpg" alt="">
    <img src="assets/img/login_roll3.jpg" alt="">
    <img src="assets/img/login_roll4.jpg" alt="">
    <img src="assets/img/login_roll5.jpg" alt="">
  </div>

  <!-- 로그인 카드 -->
  <form class="lg-card" id="lgForm">
    <div class="lg-logo"><img src="assets/img/malgeunmule_logo.svg" alt="맑은물에"></div>
    <p class="lg-sub">사내 계정으로 로그인하세요</p>
    <label>법인</label>
    <select><option>참살이</option></select>
    <label>아이디</label>
    <input type="text" id="lgId" value="admin" autocomplete="username">
    <label>비밀번호</label>
    <input type="password" id="lgPw" value="ckatkfdl1234" autocomplete="current-password">
    <div class="lg-row">
      <label style="margin:0;display:flex;align-items:center;gap:8px;font-weight:400"><input type="checkbox" checked style="width:16px;height:16px;accent-color:var(--brand)">로그인 유지</label>
      <a href="#">비밀번호 재설정</a>
    </div>
    <button class="lg-btn" type="submit" id="lgBtn">로그인</button>
    <p class="lg-help">계정이 없으신가요?  관리자에게 문의하세요</p>
  </form>

  <p class="lg-foot">© 맑은물에 · Smart SYNCWORKS</p>

<script>
/* 배경 5장 크로스페이드 롤링 (5초 간격) */
(function(){
  var imgs=document.querySelectorAll('#bgRoll img'), i=0;
  setInterval(function(){
    imgs[i].classList.remove('on');
    i=(i+1)%imgs.length;
    imgs[i].classList.add('on');
  },5000);
})();

/* 더미 로그인: admin / ckatkfdl1234 일치 시 대시보드로, 아니면 셰이크 */
(function(){
  var form=document.getElementById('lgForm'),
      id=document.getElementById('lgId'),
      pw=document.getElementById('lgPw'),
      btn=document.getElementById('lgBtn');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    id.classList.remove('err'); pw.classList.remove('err');
    var ok = id.value.trim()==='admin' && pw.value==='ckatkfdl1234';
    if(!ok){
      if(id.value.trim()!=='admin') id.classList.add('err');
      if(pw.value!=='ckatkfdl1234') pw.classList.add('err');
      form.classList.remove('shake'); void form.offsetWidth;
      form.classList.add('shake');
      (id.value.trim()!=='admin'?id:pw).focus();
      return;
    }
    btn.disabled=true; btn.textContent='로그인 중…';
    setTimeout(function(){ location.href='dashboard.html'; },700);
  });
})();
</script>
</body>
</html>
