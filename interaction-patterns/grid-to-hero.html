<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>이미지 그리드 → 히어로</title>
<link rel="stylesheet" href="shared.css">
<style>
  .intro, .outro { height:60vh; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  .stage { height:100vh; position:relative; overflow:hidden; }
  .gimg {
    position:absolute; top:50%; left:50%; width:200px; height:260px; margin:-130px 0 0 -100px;
    border-radius:8px; overflow:hidden; will-change:transform;
  }
  .gimg img { width:100%; height:100%; object-fit:cover; }
  .stage h2 {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:clamp(2.5rem,8vw,6rem); z-index:10; mix-blend-mode:difference; white-space:nowrap;
  }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">그리드 → 히어로 — 흩어져 있던 이미지들이 중앙으로 모입니다</span></div>
<div class="intro">↓ 스크롤</div>
<div class="stage" id="stage">
  <h2>Collected Works</h2>
  <div class="gimg" data-x="-420" data-y="-180" data-r="-8"><img src="https://picsum.photos/id/1015/400/520"></div>
  <div class="gimg" data-x="380" data-y="-220" data-r="6"><img src="https://picsum.photos/id/1043/400/520"></div>
  <div class="gimg" data-x="-350" data-y="200" data-r="5"><img src="https://picsum.photos/id/1050/400/520"></div>
  <div class="gimg" data-x="430" data-y="160" data-r="-6"><img src="https://picsum.photos/id/1062/400/520"></div>
  <div class="gimg" data-x="0" data-y="-300" data-r="3"><img src="https://picsum.photos/id/1069/400/520"></div>
  <div class="gimg" data-x="40" data-y="290" data-r="-4"><img src="https://picsum.photos/id/1080/400/520"></div>
</div>
<div class="outro">각 이미지의 흩어진 좌표 → (0,0)으로 스크럽 수렴</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const tl = gsap.timeline({
  scrollTrigger:{ trigger:'#stage', start:'top top', end:'+=1600', pin:true, scrub:true }
});
document.querySelectorAll('.gimg').forEach((el, i) => {
  tl.fromTo(el,
    { x:+el.dataset.x * 1.6, y:+el.dataset.y * 1.6, rotation:+el.dataset.r * 2, scale:.9 },
    { x:0, y:0, rotation:(i-2.5)*2, scale:1, ease:'power2.inOut', duration:1 }, 0);
});
</script>
</body>
</html>
