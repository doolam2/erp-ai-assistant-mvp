<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>가변 폰트 인터랙션</title>
<link rel="stylesheet" href="shared.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3.5rem; text-align:center; }
  .label { font-size:.75rem; color:var(--dim); letter-spacing:.2em; margin-bottom:-2.6rem; }
  .vf { font-size:clamp(2.2rem,8vw,6rem); letter-spacing:-.02em; display:flex; white-space:pre; }
  #xword  { font-family:'Pretendard Variable', Pretendard, sans-serif; }
  #dword  { font-family:'Inter', sans-serif; }
  .vf span { font-variation-settings:'wght' 200; will-change:font-variation-settings; }
  .note { color:var(--dim); font-size:.9rem; max-width:46ch; line-height:1.7; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">가변 폰트 — 커서 근처 글자가 굵어짐 (X축 기준 / 2D 거리 기준)</span></div>
<main>
  <div class="label">X축 거리 기준 — 좌우로만 움직여도 반응</div>
  <h1 class="vf" id="xword">기획자의 포트폴리오</h1>
  <div class="label">2D 거리 기준 — 상하로 멀어지면 같이 얇아짐</div>
  <h1 class="vf" id="dword">INTERACTIVE</h1>
  <p class="note">가변 폰트의 wght 축(100~900)을 커서 거리로 실시간 제어. 목표값에 바로 가지 않고
  lerp(12%)로 따라가게 해서 굵기 변화가 출렁이듯 부드럽습니다.</p>
</main>
<script>
function split(el){
  el.innerHTML = [...el.textContent].map(c => `<span>${c}</span>`).join('');
  return [...el.querySelectorAll('span')].map(s => ({ el:s, w:200, target:200 }));
}
const xChars = split(document.getElementById('xword'));
const dChars = split(document.getElementById('dword'));
let mx = -9999, my = -9999;
addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
(function loop(){
  xChars.forEach(c => {
    const r = c.el.getBoundingClientRect();
    const d = Math.abs(mx - (r.left + r.width/2));        // X축 거리만
    c.target = Math.max(100, 900 - d*3);
  });
  dChars.forEach(c => {
    const r = c.el.getBoundingClientRect();
    const d = Math.hypot(mx - (r.left + r.width/2), my - (r.top + r.height/2)); // 2D 거리
    c.target = Math.max(100, 900 - d*2.2);
  });
  [...xChars, ...dChars].forEach(c => {
    c.w += (c.target - c.w) * 0.12;                        // lerp로 출렁임
    c.el.style.fontVariationSettings = `'wght' ${Math.round(c.w)}`;
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
