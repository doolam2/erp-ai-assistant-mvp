<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>시계/위치 위젯</title>
<link rel="stylesheet" href="shared.css">
<style>
  main { min-height:100vh; display:flex; align-items:center; justify-content:center; }
  h1 { font-size:clamp(2rem,6vw,4rem); color:var(--dim); }
  .corner { position:fixed; font-family:Menlo,monospace; font-size:.75rem; letter-spacing:.1em; color:var(--dim); line-height:1.8; }
  .corner b { color:var(--fg); font-weight:400; }
  .bl { bottom:1.5rem; left:1.5rem; }
  .br { bottom:1.5rem; right:1.5rem; text-align:right; }
  .tr { top:4.5rem; right:1.5rem; text-align:right; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#3ddc84; margin-right:.4em; animation:pulse 2s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">시계/위치 위젯 — 스튜디오 사이트 코너의 단골 장식</span></div>
<main><h1>화면 모서리를 보세요</h1></main>
<div class="corner bl">SEOUL, KR<br><b id="seoul">--:--:--</b> KST</div>
<div class="corner br">37.5665° N, 126.9780° E<br><b><span class="dot"></span>AVAILABLE FOR WORK</b></div>
<div class="corner tr">NEW YORK<br><b id="ny">--:--:--</b> EST</div>
<script>
function clock(id, tz){
  const el = document.getElementById(id);
  setInterval(() => {
    el.textContent = new Date().toLocaleTimeString('en-GB', { timeZone: tz, hour12:false });
  }, 1000);
}
clock('seoul', 'Asia/Seoul');
clock('ny', 'America/New_York');
</script>
</body>
</html>
