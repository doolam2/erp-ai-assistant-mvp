<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>슬라이스 텍스트</title>
<link rel="stylesheet" href="shared.css">
<style>
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.2rem; }
  a.slice {
    position:relative; display:block; text-decoration:none; color:var(--fg);
    font-size:clamp(2.2rem,7vw,5rem); font-weight:800; letter-spacing:-.01em; line-height:1.25;
    padding:.15em 0;
  }
  a.slice i { font-style:normal; visibility:hidden; }        /* 자리 지킴이 */
  a.slice b, a.slice u {
    position:absolute; inset:0; font-weight:inherit; text-decoration:none; padding:.15em 0;
    transition:transform .4s cubic-bezier(.76,0,.24,1), color .4s;
  }
  a.slice b { clip-path:inset(0 0 50% 0); }                   /* 윗동강 */
  a.slice u { clip-path:inset(50% 0 0 0); }                   /* 아랫동강 */
  a.slice:hover b { transform:translateX(.18em); color:var(--accent); }
  a.slice:hover u { transform:translateX(-.18em); }
  .note { color:var(--dim); font-size:.9rem; margin-top:1.5rem; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">슬라이스 텍스트 — 호버하면 글자가 상하 반으로 갈라져 어긋납니다</span></div>
<main>
  <a class="slice" href="#"><i>PROJECTS</i><b>PROJECTS</b><u>PROJECTS</u></a>
  <a class="slice" href="#"><i>STUDIO</i><b>STUDIO</b><u>STUDIO</u></a>
  <a class="slice" href="#"><i>CONTACT</i><b>CONTACT</b><u>CONTACT</u></a>
  <p class="note">같은 텍스트 2벌을 clip-path로 반씩 잘라 반대 방향으로 미는 구조</p>
</main>
</body>
</html>
