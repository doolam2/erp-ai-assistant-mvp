<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>리스트 호버 이미지</title>
<link rel="stylesheet" href="shared.css">
<style>
  main { min-height:100vh; display:flex; flex-direction:column; justify-content:center; max-width:800px; margin:0 auto; padding:2rem; }
  .item {
    display:flex; justify-content:space-between; align-items:baseline;
    padding:1.8rem .5rem; border-bottom:1px solid rgba(255,255,255,.12);
    font-size:clamp(1.6rem,4vw,2.6rem); font-weight:700; cursor:pointer;
    transition:padding-left .3s, color .3s;
  }
  .item:hover { padding-left:1.2rem; color:var(--accent); }
  .item small { font-size:.9rem; font-weight:400; color:var(--dim); }
  #preview {
    position:fixed; width:260px; height:340px; pointer-events:none; z-index:50;
    border-radius:8px; overflow:hidden; opacity:0; transform:translate(-50%,-50%) scale(.8);
  }
  #preview img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .35s; }
  #preview img.on { opacity:1; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">리스트 호버 이미지 — 프로젝트 이름에 호버해 보세요</span></div>
<main id="list">
  <div class="item" data-i="0">Brand Identity <small>2026</small></div>
  <div class="item" data-i="1">E-Commerce <small>2025</small></div>
  <div class="item" data-i="2">Mobile App <small>2025</small></div>
  <div class="item" data-i="3">Exhibition <small>2024</small></div>
</main>
<div id="preview">
  <img src="https://picsum.photos/id/1015/520/680">
  <img src="https://picsum.photos/id/1043/520/680">
  <img src="https://picsum.photos/id/1062/520/680">
  <img src="https://picsum.photos/id/1080/520/680">
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
const preview = document.getElementById('preview');
const imgs = preview.querySelectorAll('img');
const setX = gsap.quickTo(preview, 'left', {duration:.5, ease:'power3.out'});
const setY = gsap.quickTo(preview, 'top',  {duration:.5, ease:'power3.out'});
addEventListener('mousemove', e => { setX(e.clientX); setY(e.clientY); });
document.querySelectorAll('.item').forEach(item => {
  item.addEventListener('mouseenter', () => {
    imgs.forEach((im,i) => im.classList.toggle('on', i == item.dataset.i));
    gsap.to(preview, { opacity:1, scale:1, duration:.4, ease:'power3.out' });
  });
});
document.getElementById('list').addEventListener('mouseleave', () => {
  gsap.to(preview, { opacity:0, scale:.8, duration:.3 });
});
</script>
</body>
</html>
