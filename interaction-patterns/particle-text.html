<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>파티클 텍스트</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { overflow:hidden; }
  canvas { position:fixed; inset:0; }
  .ui { position:fixed; bottom:1.4rem; left:50%; transform:translateX(-50%); display:flex; gap:.8rem; align-items:center; }
  button { font:inherit; padding:.6rem 1.5rem; border-radius:99px; border:1.5px solid var(--fg); background:rgba(17,17,17,.6); color:var(--fg); cursor:pointer; }
  .note { color:var(--dim); font-size:.85rem; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">파티클 텍스트 — 글자가 입자로 분해·조립됩니다. 마우스로 흩어보세요</span></div>
<canvas id="c"></canvas>
<div class="ui"><button id="boom">폭발</button><span class="note">커서를 대면 밀려나고, 놓으면 제자리로 모입니다</span></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let parts = [];
function build(){
  cv.width = innerWidth; cv.height = innerHeight;
  // 오프스크린에 텍스트를 그려 픽셀 좌표 샘플링
  const off = document.createElement('canvas');
  off.width = innerWidth; off.height = innerHeight;
  const octx = off.getContext('2d');
  const size = Math.min(innerWidth / 5.2, 210);
  octx.font = `900 ${size}px "Helvetica Neue", sans-serif`;
  octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.fillText('PARTICLE', innerWidth / 2, innerHeight / 2);
  const data = octx.getImageData(0, 0, off.width, off.height).data;
  parts = [];
  const STEP = 5;                                 // 샘플 간격(작을수록 촘촘·무거움)
  for (let y = 0; y < off.height; y += STEP)
    for (let x = 0; x < off.width; x += STEP)
      if (data[(y * off.width + x) * 4 + 3] > 128)
        parts.push({ hx: x, hy: y, x: Math.random() * innerWidth, y: Math.random() * innerHeight, vx: 0, vy: 0 });
}
build(); addEventListener('resize', build);
let mx = -9999, my = -9999;
addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
addEventListener('mouseout', () => { mx = my = -9999; });
document.getElementById('boom').onclick = () => parts.forEach(p => {
  const a = Math.random() * Math.PI * 2, f = 8 + Math.random() * 22;
  p.vx += Math.cos(a) * f; p.vy += Math.sin(a) * f;
});
(function loop(){
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#f5f2ec';
  parts.forEach(p => {
    // 홈 포지션 스프링
    p.vx += (p.hx - p.x) * .012; p.vy += (p.hy - p.y) * .012;
    // 마우스 반발
    const dx = p.x - mx, dy = p.y - my, d2 = dx * dx + dy * dy;
    if (d2 < 90 * 90){ const d = Math.sqrt(d2) || 1, f = (90 - d) / 90 * 1.6; p.vx += dx / d * f; p.vy += dy / d * f; }
    p.vx *= .88; p.vy *= .88;
    p.x += p.vx; p.y += p.vy;
    ctx.fillRect(p.x, p.y, 2.2, 2.2);
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
