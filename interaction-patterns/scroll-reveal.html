<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>스크롤 리빌</title>
<link rel="stylesheet" href="shared.css">
<style>
  .top { height:80vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:.6rem; }
  h1 { font-size:clamp(2rem,6vw,4rem); }
  .grid { max-width:1000px; margin:0 auto 30vh; padding:0 2rem; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1.5rem; }
  .card {
    background:#1c1c1c; border:1px solid rgba(255,255,255,.08); border-radius:12px;
    padding:2rem; min-height:220px; display:flex; flex-direction:column; justify-content:flex-end; gap:.5rem;
  }
  .card b { font-size:1.3rem; }
  .card p { color:var(--dim); font-size:.9rem; line-height:1.6; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">스크롤 리빌 — 아래로 스크롤하면 카드가 떠오르며 나타납니다</span></div>
<div class="top"><h1>Scroll to Reveal</h1><p style="color:var(--dim)">↓</p></div>
<div class="grid">
  <div class="card reveal"><b>Strategy</b><p>브랜드 방향성과 목표를 정의합니다</p></div>
  <div class="card reveal"><b>Design</b><p>인터페이스와 비주얼 시스템을 만듭니다</p></div>
  <div class="card reveal"><b>Development</b><p>성능과 접근성을 갖춘 코드로 구현합니다</p></div>
  <div class="card reveal"><b>Motion</b><p>브랜드에 생동감을 더하는 모션을 설계합니다</p></div>
  <div class="card reveal"><b>Content</b><p>이야기가 있는 콘텐츠를 기획합니다</p></div>
  <div class="card reveal"><b>Launch</b><p>배포와 운영, 지표 분석까지 함께합니다</p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
gsap.utils.toArray('.reveal').forEach((el, i) => {
  gsap.from(el, {
    y: 60, opacity: 0, duration: 1, ease: 'power3.out',
    delay: (i % 3) * 0.1,             // 같은 줄 안에서만 살짝 스태거
    scrollTrigger: { trigger: el, start: 'top 88%', toggleActions: 'play none none reverse' }
  });
});
</script>
</body>
</html>
