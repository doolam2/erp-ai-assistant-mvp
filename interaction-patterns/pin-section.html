<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>핀 섹션</title>
<link rel="stylesheet" href="shared.css">
<style>
  .intro, .outro { height:70vh; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  .pin-wrap { height:100vh; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .step { position:absolute; text-align:center; }
  .step h2 { font-size:clamp(2.5rem,8vw,6rem); letter-spacing:-.02em; }
  .step p { color:var(--dim); margin-top:1rem; }
  .step:nth-child(1) h2 { color:var(--fg); }
  .step:nth-child(2) h2 { color:var(--accent); }
  .step:nth-child(3) h2 { color:#7db8ff; }
  .counter { position:absolute; bottom:2rem; left:50%; transform:translateX(-50%); color:var(--dim); letter-spacing:.3em; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">핀 섹션 — 섹션이 고정된 채 내용만 3번 바뀝니다</span></div>
<div class="intro">↓ 스크롤</div>
<div class="pin-wrap" id="pin">
  <div class="step"><h2>Discover</h2><p>첫 번째 단계</p></div>
  <div class="step"><h2>Design</h2><p>두 번째 단계</p></div>
  <div class="step"><h2>Deliver</h2><p>세 번째 단계</p></div>
  <div class="counter" id="cnt">1 / 3</div>
</div>
<div class="outro">핀이 풀리고 다시 일반 스크롤로 돌아왔습니다</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const steps = gsap.utils.toArray('.step');
gsap.set(steps.slice(1), { autoAlpha:0, y:40 });
const tl = gsap.timeline({
  scrollTrigger: {
    trigger:'#pin', start:'top top', end:'+=2400',
    pin:true, scrub:0.5,
    onUpdate:self => {
      document.getElementById('cnt').textContent =
        Math.min(3, 1+Math.floor(self.progress*2.999)) + ' / 3';
    }
  }
});
tl.to(steps[0], { autoAlpha:0, y:-40, duration:1 }, 1)
  .to(steps[1], { autoAlpha:1, y:0, duration:1 })
  .to(steps[1], { autoAlpha:0, y:-40, duration:1 }, '+=1')
  .to(steps[2], { autoAlpha:1, y:0, duration:1 })
  .to({}, { duration:1 });
</script>
</body>
</html>
