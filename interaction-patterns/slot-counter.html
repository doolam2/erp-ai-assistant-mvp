<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>슬롯머신 카운터</title>
<link rel="stylesheet" href="shared.css">
<style>
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3.5rem; }
  .stats { display:flex; gap:4rem; flex-wrap:wrap; justify-content:center; }
  .stat { text-align:center; }
  .digits { display:flex; font-size:clamp(2.6rem,7vw,5rem); font-weight:800; font-variant-numeric:tabular-nums; }
  .digit { overflow:hidden; height:1.15em; line-height:1.15; }
  .digit .col { display:block; will-change:transform; }
  .digit .col b { display:block; height:1.15em; font-weight:inherit; }
  .digit.comma { overflow:visible; }
  .stat p { margin-top:.5rem; color:var(--dim); font-size:.85rem; letter-spacing:.15em; }
  button { font:inherit; padding:.7rem 1.8rem; border-radius:99px; border:1.5px solid var(--fg); background:transparent; color:var(--fg); cursor:pointer; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">슬롯머신 카운터 — 숫자가 오도미터처럼 세로로 굴러 도달합니다</span></div>
<main>
  <div class="stats">
    <div class="stat"><div class="digits" data-num="12480"></div><p>SUBSCRIBERS</p></div>
    <div class="stat"><div class="digits" data-num="87"></div><p>PROJECTS</p></div>
    <div class="stat"><div class="digits" data-num="15"></div><p>AWARDS</p></div>
  </div>
  <button id="replay">다시 굴리기</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
const STRIP = '0123456789'.split('').map(n => `<b>${n}</b>`).join('');
function build(el){
  const str = (+el.dataset.num).toLocaleString('en-US');
  el.innerHTML = [...str].map(ch =>
    ch === ',' ? `<div class="digit comma"><b>,</b></div>`
               : `<div class="digit"><span class="col" data-n="${ch}">${STRIP}</span></div>`
  ).join('');
}
function play(){
  document.querySelectorAll('.col').forEach((col, i) => {
    const n = +col.dataset.n;
    gsap.fromTo(col, { yPercent: 0 }, {
      yPercent: -10 * n,                        // 0~9 스트립에서 목표 숫자 위치로
      duration: 1.6 + i * 0.12,                 // 뒷자리일수록 늦게 멈춤(슬롯머신 감)
      ease: 'power4.out',
    });
  });
}
document.querySelectorAll('.digits').forEach(build);
play();
document.getElementById('replay').onclick = play;
</script>
</body>
</html>
