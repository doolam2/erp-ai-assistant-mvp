<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>3D 플립 리빌</title>
<link rel="stylesheet" href="shared.css">
<style>
  .spacer { height:65vh; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  section { min-height:85vh; display:flex; align-items:center; justify-content:center; padding:2rem; perspective:900px; }
  .fr { font-size:clamp(2.2rem,7vw,5.5rem); font-weight:800; letter-spacing:-.01em; text-align:center; line-height:1.3; }
  .fr span { display:inline-block; transform-style:preserve-3d; backface-visibility:hidden; will-change:transform,opacity; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">3D 플립 리빌 — 글자가 카드 뒤집히듯 돌아서 등장합니다</span></div>
<div class="spacer">↓ 스크롤</div>
<section><h1 class="fr" data-fr="x">FLIP THE SCRIPT</h1></section>
<section><h1 class="fr" data-fr="y">글자가 문처럼 열린다</h1></section>
<div class="spacer">rotateX(위→아래로 넘어짐) / rotateY(문처럼 열림) 두 변형</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
document.querySelectorAll('[data-fr]').forEach(el => {
  const axis = el.dataset.fr;                       // x | y
  el.innerHTML = [...el.textContent].map(c => c === ' ' ? ' ' : `<span>${c}</span>`).join('');
  const from = axis === 'x'
    ? { rotationX:-95, yPercent:35, opacity:0, transformOrigin:'50% 100% -20px' }
    : { rotationY:95,  xPercent:-15, opacity:0, transformOrigin:'0% 50% -20px' };
  gsap.fromTo(el.querySelectorAll('span'), from, {
    rotationX:0, rotationY:0, xPercent:0, yPercent:0, opacity:1,
    duration:1.1, stagger:.045, ease:'back.out(1.4)',
    scrollTrigger:{ trigger:el, start:'top 78%', toggleActions:'play none none reverse' }
  });
});
</script>
</body>
</html>
