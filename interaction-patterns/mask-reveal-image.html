<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>마스크 리빌 이미지</title>
<link rel="stylesheet" href="shared.css">
<style>
  .spacer { height:70vh; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  .gal { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:2rem; max-width:1000px; margin:0 auto 20vh; padding:0 2rem; }
  .m { overflow:hidden; border-radius:10px; aspect-ratio:4/5; }
  .m img { width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">마스크 리빌 이미지 — 커튼이 벗겨지듯 + 줌아웃하며 등장</span></div>
<div class="spacer">↓ 스크롤</div>
<div class="gal">
  <div class="m"><img src="https://picsum.photos/id/1015/560/700"></div>
  <div class="m"><img src="https://picsum.photos/id/1043/560/700"></div>
  <div class="m"><img src="https://picsum.photos/id/1050/560/700"></div>
  <div class="m"><img src="https://picsum.photos/id/1062/560/700"></div>
  <div class="m"><img src="https://picsum.photos/id/1069/560/700"></div>
  <div class="m"><img src="https://picsum.photos/id/1080/560/700"></div>
</div>
<div class="spacer">clip-path 리빌 + 내부 이미지 scale 1.3→1 조합</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
gsap.utils.toArray('.m').forEach(box => {
  const img = box.querySelector('img');
  const tl = gsap.timeline({
    scrollTrigger:{ trigger:box, start:'top 85%', toggleActions:'play none none reverse' }
  });
  tl.fromTo(box, { clipPath:'inset(0 0 100% 0)' },
                 { clipPath:'inset(0 0 0% 0)', duration:1.2, ease:'power4.inOut' })
    .from(img, { scale:1.35, duration:1.6, ease:'power3.out' }, 0);
});
</script>
</body>
</html>
