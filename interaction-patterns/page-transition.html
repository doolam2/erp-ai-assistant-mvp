<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>페이지 트랜지션</title>
<link rel="stylesheet" href="shared.css">
<style>
  .page { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5rem; }
  .page h1 { font-size:clamp(2.5rem,8vw,6rem); letter-spacing:-.03em; }
  #pageB { background:#f5f2ec; color:#111; visibility:hidden; }
  .curtain { position:fixed; inset:0; background:var(--accent); transform:scaleY(0); z-index:1500; }
  button { font:inherit; padding:.8rem 2rem; border-radius:99px; border:1.5px solid currentColor; background:transparent; color:inherit; cursor:pointer; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">페이지 트랜지션 — 커튼이 화면을 덮었다 걷으며 페이지 교체</span></div>
<div class="page" id="pageA"><h1>Home</h1><button class="go">About으로 이동 →</button></div>
<div class="page" id="pageB"><h1>About</h1><button class="go">← Home으로 이동</button></div>
<div class="curtain" id="curtain"></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
let showingA = true, busy = false;
document.querySelectorAll('.go').forEach(btn => btn.onclick = () => {
  if (busy) return; busy = true;
  const from = showingA ? '#pageA' : '#pageB';
  const to   = showingA ? '#pageB' : '#pageA';
  const tl = gsap.timeline({ onComplete:() => { showingA = !showingA; busy = false; } });
  tl.set('#curtain', { transformOrigin:'bottom' })
    .to('#curtain', { scaleY:1, duration:.55, ease:'power4.inOut' })   // 아래에서 덮음
    .set(from, { visibility:'hidden' })
    .set(to,   { visibility:'visible' })
    .set('#curtain', { transformOrigin:'top' })
    .to('#curtain', { scaleY:0, duration:.55, ease:'power4.inOut' })   // 위로 걷힘
    .from(to + ' h1', { y:50, opacity:0, duration:.8, ease:'expo.out' }, '-=0.3');
});
</script>
</body>
</html>
