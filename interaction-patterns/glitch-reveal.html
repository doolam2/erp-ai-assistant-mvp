<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>글리치 리빌</title>
<link rel="stylesheet" href="shared.css">
<style>
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2rem; }
  .glitch { position:relative; font-size:clamp(2.4rem,8vw,6rem); font-weight:800; letter-spacing:-.01em; }
  .glitch i { font-style:normal; position:absolute; inset:0; opacity:0; pointer-events:none; }
  .glitch i.r { color:#ff2b4e; }
  .glitch i.b { color:#22d3ee; }
  button { font:inherit; padding:.7rem 1.8rem; border-radius:99px; border:1.5px solid var(--fg); background:transparent; color:var(--fg); cursor:pointer; }
  .note { color:var(--dim); font-size:.9rem; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">글리치 리빌 — RGB 채널이 어긋났다 합쳐지며 등장합니다</span></div>
<main>
  <h1 class="glitch" id="g">SIGNAL LOST</h1>
  <p class="note">빨강·시안 복제본을 무작위로 어긋내고 클립으로 찢다가 정착</p>
  <button id="replay">다시 재생</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
const g = document.getElementById('g');
g.innerHTML = g.textContent + `<i class="r">${g.textContent}</i><i class="b">${g.textContent}</i>`;
const r = g.querySelector('.r'), b = g.querySelector('.b');
function play(){
  const tl = gsap.timeline();
  tl.fromTo(g, { opacity:0 }, { opacity:1, duration:.05 });
  for (let i = 0; i < 14; i++){                       // 14프레임의 무작위 찢김
    const clip = () => `inset(${gsap.utils.random(0,80)}% 0 ${gsap.utils.random(0,60)}% 0)`;
    tl.set(r, { opacity:1, x:gsap.utils.random(-14,14), clipPath:clip() })
      .set(b, { opacity:1, x:gsap.utils.random(-14,14), clipPath:clip() }, '<')
      .set(g, { x:gsap.utils.random(-5,5) }, '<')
      .to({}, { duration:.045 });
  }
  tl.set([r,b], { opacity:0 }).set(g, { x:0 });        // 정착
}
play();
document.getElementById('replay').onclick = play;
setInterval(() => Math.random() < .5 && play(), 3800); // 이따금 재글리치
</script>
</body>
</html>
