<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>리퀴드 셰이더 텍스트</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { overflow:hidden; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; cursor:crosshair; }
  .note { position:fixed; bottom:1.4rem; left:50%; transform:translateX(-50%); color:var(--dim); font-size:.85rem; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">리퀴드 셰이더 — 글자 표면이 물처럼 일렁이고, 커서가 물결을 만듭니다</span></div>
<canvas id="gl"></canvas>
<p class="note">텍스트를 캔버스에 그려 WebGL 텍스처로 쓰고, 셰이더에서 UV를 흐르는 파형으로 왜곡</p>
<script>
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl');

// ① 텍스트를 오프스크린 2D 캔버스에 그려 텍스처로
function makeTextTexture(){
  const t = document.createElement('canvas');
  t.width = 2048; t.height = 1024;
  const c = t.getContext('2d');
  c.fillStyle = '#111'; c.fillRect(0, 0, t.width, t.height);
  c.fillStyle = '#f5f2ec';
  c.font = '900 300px "Helvetica Neue", sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('LIQUID', t.width/2, t.height/2 - 130);
  c.fillStyle = '#e14f2a';
  c.fillText('TYPE', t.width/2, t.height/2 + 190);
  return t;
}
const vs = `attribute vec2 p; varying vec2 vUv;
void main(){ vUv = p * .5 + .5; vUv.y = 1. - vUv.y; gl_Position = vec4(p, 0., 1.); }`;
const fs = `precision mediump float;
varying vec2 vUv; uniform sampler2D tex; uniform float uT; uniform vec2 uM; uniform float uAsp;
void main(){
  vec2 uv = vUv;
  // 상시 흐르는 액체 파형(두 방향 사인 중첩)
  uv.x += sin(uv.y * 9. + uT * 1.4) * .012 + sin(uv.y * 23. - uT * .9) * .004;
  uv.y += cos(uv.x * 11. + uT * 1.1) * .012 + cos(uv.x * 29. + uT * .7) * .004;
  // 커서 주변 동심원 물결
  vec2 d = (uv - uM) * vec2(uAsp, 1.);
  float dist = length(d);
  uv += normalize(d + 1e-4) * sin(dist * 42. - uT * 5.) * .014 * smoothstep(.45, .0, dist);
  gl_FragColor = texture2D(tex, uv);
}`;
function sh(t, s){ const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); return x; }
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const lp = gl.getAttribLocation(pr, 'p');
gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp, 2, gl.FLOAT, false, 0, 0);
const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, makeTextTexture());
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
const uT = gl.getUniformLocation(pr, 'uT');
const uM = gl.getUniformLocation(pr, 'uM');
const uAsp = gl.getUniformLocation(pr, 'uAsp');
let mouse = [.5, .5];
addEventListener('mousemove', e => mouse = [e.clientX / innerWidth, e.clientY / innerHeight]);
function fit(){
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform1f(uAsp, innerWidth / innerHeight);
}
fit(); addEventListener('resize', fit);
(function loop(t){
  gl.uniform1f(uT, t * .001);
  gl.uniform2f(uM, mouse[0], mouse[1]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(loop);
})(0);
</script>
</body>
</html>
