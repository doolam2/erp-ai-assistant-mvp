<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>블러 리빌</title>
<link rel="stylesheet" href="shared.css">
<style>
  .spacer { height:65vh; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  section { min-height:85vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
  .br { font-size:clamp(2rem,6vw,4.5rem); font-weight:700; letter-spacing:-.02em; text-align:center; max-width:18ch; line-height:1.35; }
  .br span { display:inline-block; will-change:filter,opacity,transform; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">블러 리빌 — 초점 나간 글자가 또렷하게 맺히며 등장합니다</span></div>
<div class="spacer">↓ 스크롤</div>
<section><h1 class="br" data-br>흐릿한 기억이 선명한 문장이 된다</h1></section>
<section><h1 class="br" data-br>FOCUS FINDS FORM</h1></section>
<div class="spacer">blur 18px→0 + 미세한 확대 축소. 플루이드 텍스트의 절제 버전</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
document.querySelectorAll('[data-br]').forEach(el => {
  el.innerHTML = el.textContent.split(' ').map(w =>
    `<span>${w}</span>`).join(' ');
  gsap.fromTo(el.querySelectorAll('span'),
    { filter:'blur(18px)', opacity:0, scale:1.12 },
    { filter:'blur(0px)', opacity:1, scale:1,
      duration:1.3, stagger:.09, ease:'power2.out',
      scrollTrigger:{ trigger:el, start:'top 78%', toggleActions:'play none none reverse' } });
});
</script>
</body>
</html>
