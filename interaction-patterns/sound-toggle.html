<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>사운드 토글</title>
<link rel="stylesheet" href="shared.css">
<style>
  main { min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2rem; }
  h1 { font-size:clamp(2rem,6vw,4rem); }
  .note { color:var(--dim); }
  #snd {
    position:fixed; bottom:1.5rem; right:1.5rem; width:58px; height:58px; border-radius:50%;
    border:1.5px solid var(--fg); background:rgba(17,17,17,.6); cursor:pointer;
    display:flex; align-items:flex-end; justify-content:center; gap:3px; padding-bottom:19px;
  }
  #snd i { display:block; width:3px; height:4px; background:var(--fg); border-radius:2px; transition:height .2s; }
  #snd.on { border-color:var(--accent); }
  #snd.on i { background:var(--accent); }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">사운드 토글 — 우하단 버튼. 파형 바가 실제 소리에 맞춰 움직입니다</span></div>
<main>
  <h1>Ambient Sound</h1>
  <p class="note">브라우저 정책상 첫 클릭 후에만 소리를 낼 수 있습니다 (WebAudio 합성음)</p>
</main>
<button id="snd" aria-label="sound toggle"><i></i><i></i><i></i><i></i></button>
<script>
const btn = document.getElementById('snd');
const bars = btn.querySelectorAll('i');
let actx = null, gain = null, on = false, raf;
function start(){
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  gain = actx.createGain(); gain.gain.value = 0;
  gain.connect(actx.destination);
  // 잔잔한 앰비언트 코드(3음) 합성
  [220, 277.18, 329.63].forEach(f => {
    const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = actx.createGain(); g.gain.value = .07;
    const lfo = actx.createOscillator(); lfo.frequency.value = .15 + Math.random()*.2;
    const lg = actx.createGain(); lg.gain.value = .03;
    lfo.connect(lg); lg.connect(g.gain);
    o.connect(g); g.connect(gain); o.start(); lfo.start();
  });
  gain.gain.linearRampToValueAtTime(1, actx.currentTime + 1);
}
function animateBars(){
  bars.forEach((b,i) => b.style.height = (4 + Math.abs(Math.sin(Date.now()*.004 + i*1.3))*14) + 'px');
  raf = requestAnimationFrame(animateBars);
}
btn.onclick = () => {
  on = !on;
  btn.classList.toggle('on', on);
  if (on){ if (!gain) start(); else gain.gain.linearRampToValueAtTime(1, actx.currentTime + .5); animateBars(); }
  else { gain.gain.linearRampToValueAtTime(0, actx.currentTime + .5); cancelAnimationFrame(raf);
         bars.forEach(b => b.style.height = '4px'); }
};
</script>
</body>
</html>
