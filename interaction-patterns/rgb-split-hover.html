<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>RGB 스플릿 호버</title>
<link rel="stylesheet" href="shared.css">
<style>
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2rem; }
  h1 { font-size:clamp(2.4rem,8vw,6rem); font-weight:800; letter-spacing:-.01em; cursor:default; }
  h1 span { display:inline-block; position:relative; }
  h1 span.on {
    animation:jit .12s steps(2) infinite;
    text-shadow:-4px 0 #ff2b4e, 4px 0 #22d3ee;
  }
  @keyframes jit {
    0% { transform:translate(1.5px,-1px); }
    50% { transform:translate(-1.5px,1px); }
    100% { transform:translate(1px,1.5px); }
  }
  .note { color:var(--dim); font-size:.9rem; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">RGB 스플릿 호버 — 커서가 닿은 글자만 채널이 분리돼 떨립니다</span></div>
<main>
  <h1 id="t">HOVER THE PIXELS</h1>
  <p class="note">글자별 mouseenter로 텍스트섀도(빨강/시안) + 스텝 지터 적용, 떠나면 0.3초 후 복구</p>
</main>
<script>
const t = document.getElementById('t');
t.innerHTML = [...t.textContent].map(c => c === ' ' ? ' ' : `<span>${c}</span>`).join('');
t.querySelectorAll('span').forEach(s => {
  let off;
  s.addEventListener('mouseenter', () => { clearTimeout(off); s.classList.add('on'); });
  s.addEventListener('mouseleave', () => { off = setTimeout(() => s.classList.remove('on'), 300); });
});
</script>
</body>
</html>
