<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>가변 폰트 인터랙션</title>
<link rel="stylesheet" href="shared.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
<style>
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2rem; }
  #word { font-family:'Inter',sans-serif; font-size:clamp(2.5rem,9vw,7rem); letter-spacing:-.02em; display:flex; }
  #word span { font-variation-settings:'wght' 200; transition:font-variation-settings .12s linear; }
  .note { color:var(--dim); font-size:.9rem; }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">가변 폰트 — 커서와 가까운 글자일수록 굵어집니다</span></div>
<main>
  <h1 id="word">INTERACTIVE</h1>
  <p class="note">가변 폰트의 wght 축을 커서 거리로 실시간 제어 (100~900)</p>
</main>
<script>
const word = document.getElementById('word');
word.innerHTML = word.textContent.split('').map(c => `<span>${c}</span>`).join('');
const spans = word.querySelectorAll('span');
addEventListener('mousemove', e => {
  spans.forEach(s => {
    const r = s.getBoundingClientRect();
    const d = Math.hypot(e.clientX - (r.left+r.width/2), e.clientY - (r.top+r.height/2));
    const w = Math.max(100, 900 - d*2.2);     // 가까울수록 900
    s.style.fontVariationSettings = `'wght' ${w}`;
  });
});
</script>
</body>
</html>
