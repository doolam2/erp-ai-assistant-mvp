<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 어시스턴트 — 개선 제안 · Smart SYNCWORKS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/style.css?v=4">
<script src="assets/theme.js"></script>
<style>
body{overflow:hidden}
.stage{position:relative;height:100vh}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.chat{position:absolute;top:0;right:0;bottom:0;width:430px;max-width:100vw;background:var(--surface);border-left:1px solid var(--g02);box-shadow:-12px 0 32px rgba(0,0,0,.10);display:flex;flex-direction:column}
.ch-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--g02)}
.ch-head .av{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ch-head b{font-size:14px}
.ch-head .x{margin-left:auto;color:var(--g05);font-size:13px;cursor:pointer}
.ch-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.55;opacity:0;transform:translateY(12px);transition:opacity .45s cubic-bezier(.22,.61,.36,1),transform .45s cubic-bezier(.22,.61,.36,1)}
.msg.show{opacity:1;transform:none}
.msg.user{align-self:flex-end;background:var(--brand);color:#fff}
.msg.ai{align-self:flex-start;background:var(--g01);color:var(--ink)}
.msg .chips{margin-top:8px;display:flex;gap:6px}
.msg .chips span{background:var(--tint-teal);color:var(--pos);font-size:9px;font-weight:700;padding:3px 8px;border-radius:10px}
.typing{align-self:flex-start;background:var(--g01);border-radius:12px;padding:12px 16px;display:none}
.typing.show{display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--g05);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.sug{align-self:stretch;background:var(--tint-blue);border:1.5px solid var(--brand);border-radius:12px;padding:16px;opacity:0;transform:translateY(16px) scale(.97);transition:opacity .5s cubic-bezier(.22,.61,.36,1),transform .5s cubic-bezier(.22,.61,.36,1)}
.sug.show{opacity:1;transform:none}
.sug .tag{display:inline-block;background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:4px 12px;border-radius:11px;margin-bottom:10px}
.sug b{display:block;font-size:14px;margin-bottom:6px}
.sug p{font-size:11px;color:var(--g08);line-height:1.6}
.sug .acts{display:flex;gap:8px;margin-top:14px}
.sug .acts .ok{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
.sug .acts .no{background:var(--surface);color:var(--g08);border:1px solid var(--g03);border-radius:8px;padding:10px 16px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer}
.sug.done .acts{display:none}
.sug .doneMsg{display:none;margin-top:12px;font-size:12px;font-weight:700;color:var(--pos)}
.sug.done .doneMsg{display:block}
.note{font-size:10px;color:var(--g05);opacity:0;transition:opacity .5s ease}
.note.show{opacity:1}
.ch-input{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--g02)}
.ch-input input{flex:1;height:44px;border:1px solid var(--g03);border-radius:22px;padding:0 18px;font-size:12px;font-family:inherit;background:var(--surface);color:var(--ink)}
.ch-input button{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;border:0;font-size:15px;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:12px;padding:12px 20px;border-radius:10px;opacity:0;transition:.4s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast a{color:var(--chart-soft);font-weight:700;margin-left:10px}
</style>
</head>
<body>
<div class="stage">
  <iframe src="dashboard.html" title="ERP"></iframe>
  <aside class="chat">
    <div class="ch-head"><span class="av">AI</span><b>AI 어시스턴트</b><span class="x">✕</span></div>
    <div class="ch-body">
      <div class="msg user" id="m1">이번 주 두부 재고 얼마나 남았어?</div>
      <div class="typing" id="tp"><i></i><i></i><i></i></div>
      <div class="msg ai" id="m2">국산 촌두부 재고는 <b>1,240모</b>입니다.<br>창고별: 중앙물류 820 · 냉장센터 420
        <div class="chips"><span>재고 DB</span><span>신뢰도 높음</span></div></div>
      <div class="sug" id="sug">
        <span class="tag">개선 제안</span>
        <b>재고 임계치 알림 자동화</b>
        <p>이번 주 같은 재고 질문이 5회 반복됐어요. 안전재고 이하로 내려가면 담당자에게 자동 알림을 보내는 기능을 추천합니다.</p>
        <div class="acts">
          <button class="ok" id="ok">대시보드에 추가</button>
          <button class="no" id="no">무시</button>
        </div>
        <span class="doneMsg">개선 제안함에 등록되었습니다 — 관리자 승인 후 반영됩니다</span>
      </div>
      <p class="note" id="nt">승낙하면 관리자 개선 제안함에 등록되고, 반영 시 대시보드에 자동으로 쌓입니다.</p>
    </div>
    <div class="ch-input">
      <input type="text" placeholder="무엇이든 물어보세요">
      <button>↑</button>
    </div>
  </aside>
</div>
<div class="toast" id="toast">개선 제안함에 등록되었습니다<a href="inbox.html">제안함 열기 →</a></div>

<script>
(function(){
  function show(id,d){setTimeout(function(){document.getElementById(id).classList.add('show')},d)}
  show('m1',500);
  show('tp',1100);
  setTimeout(function(){document.getElementById('tp').classList.remove('show');document.getElementById('tp').style.display='none'},2300);
  show('m2',2350);
  show('sug',3300);
  show('nt',3900);
  document.getElementById('ok').addEventListener('click',function(){
    document.getElementById('sug').classList.add('done');
    var t=document.getElementById('toast');t.classList.add('show');
    setTimeout(function(){t.classList.remove('show')},4200);
  });
  document.getElementById('no').addEventListener('click',function(){
    document.getElementById('sug').style.opacity='.35';
  });
  /* R 키 = 시퀀스 재생 */
  document.addEventListener('keydown',function(e){
    if((e.key==='r'||e.key==='R')&&!/input/i.test(e.target.tagName))location.reload();
  });
})();
</script>
<script src="assets/motion.js"></script>
<script src="assets/ai.js"></script>
<script src="assets/tour.js"></script>
<script src="assets/palette.js"></script>
</body>
</html>
