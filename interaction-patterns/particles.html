<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>파티클 배경</title>
<link rel="stylesheet" href="shared.css">
<style>
  canvas { position:fixed; inset:0; }
  main { position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:1rem; pointer-events:none; }
  h1 { font-size:clamp(2.5rem,8vw,5.5rem); letter-spacing:-.03em; }
  p { color:var(--dim); }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">파티클 배경 — 마우스를 움직이면 입자들이 밀려납니다</span></div>
<canvas id="c"></canvas>
<main><h1>Particles</h1><p>근접 입자끼리 선 연결 + 마우스 반발력</p></main>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
resize(); addEventListener('resize', resize);
const N = 90, ps = [];
for (let i=0;i<N;i++) ps.push({
  x:Math.random()*innerWidth, y:Math.random()*innerHeight,
  vx:(Math.random()-.5)*.5, vy:(Math.random()-.5)*.5, r:Math.random()*2+1
});
let mx=-9999, my=-9999;
addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
addEventListener('mouseout', () => { mx=my=-9999; });
(function loop(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ps.forEach(p => {
    const dx = p.x-mx, dy = p.y-my, d = Math.hypot(dx,dy);
    if (d < 120){ const f = (120-d)/120*.8; p.vx += dx/d*f; p.vy += dy/d*f; }  // 반발
    p.vx *= .98; p.vy *= .98;
    p.x += p.vx; p.y += p.vy;
    if (p.x<0||p.x>cv.width) p.vx*=-1;
    if (p.y<0||p.y>cv.height) p.vy*=-1;
    ctx.fillStyle = 'rgba(245,242,236,.8)';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });
  for (let i=0;i<N;i++) for (let j=i+1;j<N;j++){
    const a=ps[i], b=ps[j], d=Math.hypot(a.x-b.x,a.y-b.y);
    if (d<110){
      ctx.strokeStyle = `rgba(225,79,42,${(1-d/110)*.5})`;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
