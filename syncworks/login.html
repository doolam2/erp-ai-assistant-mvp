<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · Smart SYNCWORKS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/style.css?v=5">
<script src="assets/theme.js"></script>
<style>
body.login-page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--surface)}

/* ── 좌측: 회의실 사진 (N-7-C, 사용자 수정본 · 하단 기준 정렬) ── */
.lg-hero{background:#101113;min-height:100vh;overflow:hidden}
.lg-shot{width:100%;height:100vh;object-fit:cover;object-position:center bottom;display:block}

/* ── 우측: 로그인 폼 ── */
.lg-side{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 32px}
.lg-form{width:400px;max-width:100%}
.lg-title{font-size:22px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.lg-sub{font-size:12px;color:var(--g05);margin:8px 0 26px}
.lg-form label{display:block;font-size:12px;font-weight:500;color:var(--g08);margin:18px 0 8px}
.lg-form input,.lg-form select{width:100%;height:44px;border:1px solid var(--g03);border-radius:8px;padding:0 14px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--ink)}
.lg-form input:focus{outline:none;border-color:var(--brand);border-width:1.5px}
.lg-row{display:flex;justify-content:space-between;align-items:center;margin:16px 0 22px;font-size:12px}
.lg-row a{color:var(--brand);font-weight:500}
.lg-btn{width:100%;height:48px;background:var(--brand);color:#fff;border:0;border-radius:8px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .15s}
.lg-btn:hover{background:var(--brand-2)}
.lg-btn[disabled]{opacity:.75;cursor:default}
.lg-help{text-align:center;font-size:11px;color:var(--g05);margin-top:22px}
.lg-foot{font-size:10px;color:var(--g05);margin-top:44px;text-align:center}

/* 오류 셰이크 */
@keyframes lgshake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lg-form.shake{animation:lgshake .4s ease}
.lg-form input.err{border-color:var(--neg)}

/* ── 반응형: 세로 스택 ── */
@media (max-width:960px){
  body.login-page{grid-template-columns:1fr}
  .lg-hero{min-height:0;height:44vh}
  .lg-shot{height:44vh}
  .lg-side{padding:40px 20px 56px}
}
</style>
</head>
<body class="login-page">

  <!-- 좌: 회의실 사진 -->
  <section class="lg-hero">
    <img class="lg-shot" src="assets/img/login_meeting.png" alt="">
  </section>

  <!-- 우: 로그인 -->
  <section class="lg-side">
    <form class="lg-form" id="lgForm">
      <h2 class="lg-title">로그인</h2>
      <p class="lg-sub">사내 계정으로 로그인하세요</p>
      <label>법인</label>
      <select><option>참살이</option></select>
      <label>아이디</label>
      <input type="text" id="lgId" value="admin" autocomplete="username">
      <label>비밀번호</label>
      <input type="password" id="lgPw" value="ckatkfdl1234" autocomplete="current-password">
      <div class="lg-row">
        <label style="margin:0;display:flex;align-items:center;gap:8px;font-weight:400"><input type="checkbox" checked style="width:16px;height:16px;accent-color:var(--brand)">로그인 유지</label>
        <a href="#">비밀번호 재설정</a>
      </div>
      <button class="lg-btn" type="submit" id="lgBtn">로그인</button>
      <p class="lg-help">계정이 없으신가요?  관리자에게 문의하세요</p>
      <p class="lg-foot">© Smart SYNCWORKS · CommerceLab</p>
    </form>
  </section>

<script>
/* 더미 로그인: admin / ckatkfdl1234 일치 시 대시보드로, 아니면 셰이크 */
(function(){
  var form=document.getElementById('lgForm'),
      id=document.getElementById('lgId'),
      pw=document.getElementById('lgPw'),
      btn=document.getElementById('lgBtn');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    id.classList.remove('err'); pw.classList.remove('err');
    var ok = id.value.trim()==='admin' && pw.value==='ckatkfdl1234';
    if(!ok){
      if(id.value.trim()!=='admin') id.classList.add('err');
      if(pw.value!=='ckatkfdl1234') pw.classList.add('err');
      form.classList.remove('shake'); void form.offsetWidth;
      form.classList.add('shake');
      (id.value.trim()!=='admin'?id:pw).focus();
      return;
    }
    btn.disabled=true; btn.textContent='로그인 중…';
    setTimeout(function(){ location.href='dashboard.html'; },700);
  });
})();
</script>
<script src="assets/motion.js"></script>
</body>
</html>
