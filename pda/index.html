<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맑은물에 PDA 입출고 — 리디자인 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --green:#4a9e2f; --green-dark:#35761f; --nav:#676767; --orange:#ff7802; --neg:#ff4040; --info:#5dd3ff;
  --g00:#fafafb; --g01:#f3f4f6; --g02:#eaebed; --g03:#d9dadc; --g04:#c5c6c8; --g05:#a7a8aa; --g06:#8a8b8d; --g07:#6e6f71; --g08:#545557; --g09:#38393b; --g10:#1c1d1f;
  --t-green:#eaf6e4; --t-mint:#e4f8ee; --t-orange:#fff1e3; --t-red:#fff5f5;
  --r-sm:4px; --r-md:6px; --r-lg:8px; --r-pill:20px;
  --sh-sm:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#e9eaec;color:var(--g10);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ===== 보고용 셸 ===== */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--g03);padding:24px 20px;position:sticky;top:0;height:100vh;overflow:auto}
.side h1{font-size:17px;font-weight:700;line-height:24px}
.side .sub{font-size:12px;color:var(--g07);margin-top:4px;line-height:17px}
.side .group{margin-top:22px;font-size:11px;font-weight:700;color:var(--g06);letter-spacing:.04em}
.side nav{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.side nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:var(--r-md);font-size:13px;font-weight:500;color:var(--g08)}
.side nav button b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:22px;border-radius:5px;background:var(--g02);font-size:11px;font-weight:700;color:var(--g07)}
.side nav button:hover{background:var(--g01)}
.side nav button.on{background:var(--g10);color:#fff}
.side nav button.on b{background:rgba(255,255,255,.18);color:#fff}
.side .foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--g02);font-size:11px;line-height:17px;color:var(--g06)}
.side .mode{display:flex;gap:6px;margin-top:14px}
.side .mode button{flex:1;padding:8px;border:1.5px solid var(--g03);border-radius:var(--r-md);font-size:12px;font-weight:600;color:var(--g08);background:#fff}
.side .mode button.on{background:var(--green-dark);border-color:var(--green-dark);color:#fff}
.stage{padding:32px;display:flex;justify-content:center;align-items:flex-start}
.stage.single .device{display:block}
.stage .grid{display:none;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px;width:100%;max-width:1400px}
.stage.all .grid{display:grid}
.stage.all > .device{display:none}
.grid figure{display:flex;flex-direction:column;gap:10px}
.grid figcaption{font-size:12px;font-weight:600;color:var(--g08)}
.grid .thumb{width:100%;aspect-ratio:480/800;overflow:hidden;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);background:#fff;position:relative;cursor:pointer}
.grid .thumb .screen{position:absolute;left:0;top:0;width:480px;height:800px;transform-origin:0 0;display:flex}

/* ===== 디바이스 ===== */
.device{width:480px;height:800px;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.18);background:var(--g01);position:relative;flex:none}
.device .screen{display:none;width:480px;height:800px}
.device .screen.on{display:flex}
.screen{flex-direction:column;background:var(--g01);overflow:hidden;font-size:13px;line-height:19px}

/* ===== 컴포넌트 ===== */
.appbar{height:64px;flex:none;background:var(--nav);color:#fff;display:flex;align-items:center;padding:0 16px;gap:8px}
.appbar .slot{width:88px;flex:none;display:flex;align-items:center}
.appbar .slot.r{flex-direction:column;align-items:flex-end;gap:2px}
.appbar .back{display:inline-flex;align-items:center;gap:2px;padding:8px 12px 8px 8px;border-radius:8px;background:rgba(255,255,255,.14);font-size:13px;font-weight:500;color:#fff}
.appbar .back svg{width:20px;height:20px}
.appbar .titles{flex:1;text-align:center}
.appbar .titles h2{font-size:18px;font-weight:700;line-height:26px}
.appbar .titles p{font-size:11px;line-height:16px;color:rgba(255,255,255,.7)}
.appbar .r .c{font-size:12px;font-weight:500;line-height:18px}
.appbar .r .t{font-size:11px;line-height:16px;color:rgba(255,255,255,.7)}
.appbar .iconbtn{width:42px;height:34px;border-radius:8px;background:rgba(255,255,255,.14);display:inline-flex;align-items:center;justify-content:center}
.appbar .iconbtn svg{width:18px;height:18px}
.body{flex:1;min-height:0;overflow:hidden;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.body.g16{gap:16px}
.body.nb{padding-bottom:0}
.foot-scan{flex:none;background:var(--g10);color:#fff;display:flex;align-items:center;gap:10px;padding:14px 20px;font-size:12px;font-weight:500;line-height:18px}
.foot-scan svg{width:20px;height:20px;flex:none}
.foot-action{flex:none;background:var(--g00);border-top:1px solid var(--g03);padding:12px 20px 16px}
.ic{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-lg);padding:0 16px;font-weight:700;white-space:nowrap}
.btn.lg{height:56px;font-size:17px;line-height:22px}
.btn.md{height:44px;font-size:13px}
.btn.primary{background:var(--green);color:#fff}
.btn.secondary{background:var(--g00);color:var(--g10);border:1.5px solid var(--g04)}
.btn.ghost{background:var(--g02);color:var(--g10)}
.btn.block{display:flex;width:100%}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:500;line-height:18px;color:var(--g08)}
.field .box{height:52px;border-radius:var(--r-lg);background:var(--g00);border:1.5px solid var(--g04);display:flex;align-items:center;padding:0 14px;gap:8px;font-size:15px;font-weight:500;line-height:22px}
.field .box .ph{color:var(--g05)}
.field .box .v{flex:1}
.field .box svg{width:20px;height:20px;color:var(--g07)}

.pill{display:inline-flex;align-items:center;padding:3px 8px;border-radius:var(--r-sm);font-size:11px;font-weight:700;line-height:16px;white-space:nowrap}
.pill.neutral{background:var(--g02);color:var(--g08)}
.pill.pos{background:var(--t-green);color:var(--green-dark)}
.pill.warn{background:var(--t-orange);color:var(--orange)}
.pill.danger{background:var(--t-red);color:var(--neg)}

.chips{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;padding:8px 14px;border-radius:var(--r-pill);font-size:13px;font-weight:500;line-height:19px;background:var(--g00);border:1.5px solid var(--g04);color:var(--g09);white-space:nowrap}
.chip.on{background:var(--g10);border-color:var(--g10);color:#fff}

.sec-head{display:flex;align-items:center;gap:8px}
.sec-head h3{font-size:15px;font-weight:700;line-height:22px}
.sec-head .sub{flex:1;font-size:11px;line-height:16px;color:var(--g07)}
.sec-head .cnt{font-size:12px;font-weight:700;line-height:18px;color:var(--g08)}
.section{display:flex;flex-direction:column;gap:10px}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.card{background:var(--g00);border:1px solid var(--g03);border-radius:var(--r-lg)}
.menu-card{height:132px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.menu-card.tall{height:180px}
.menu-card .top{display:flex;justify-content:space-between;align-items:flex-start}
.menu-card .ibox{width:40px;height:40px;border-radius:var(--r-md);background:var(--t-green);color:var(--green-dark);display:flex;align-items:center;justify-content:center}
.menu-card .nums{text-align:right}
.menu-card .nums .n{display:flex;align-items:baseline;justify-content:flex-end;gap:2px}
.menu-card .nums b{font-size:26px;font-weight:700;line-height:34px;color:var(--green-dark)}
.menu-card .nums span{font-size:13px;font-weight:500;color:var(--g06)}
.menu-card .nums .cap{font-size:11px;line-height:16px;color:var(--g06)}
.menu-card h4{font-size:20px;font-weight:700;line-height:26px}
.menu-card .s{font-size:11px;line-height:16px;color:var(--g07);margin-top:2px}

.type-card{height:116px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.type-card .top{display:flex;justify-content:space-between;align-items:center;color:var(--green-dark)}
.type-card .n{display:flex;align-items:baseline;gap:2px}
.type-card .n b{font-size:22px;font-weight:700;line-height:26px;color:var(--green-dark)}
.type-card .n span{font-size:12px;font-weight:500;color:var(--g06)}
.type-card h4{font-size:16px;font-weight:700;line-height:22px}
.type-card .s{font-size:11px;line-height:16px;color:var(--g07);margin-top:2px}

.row{height:64px;padding:0 14px;display:flex;align-items:center;gap:12px}
.row.sm{height:58px}
.row .cb{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--g05);background:var(--g00);flex:none}
.row .tx{flex:1;min-width:0}
.row .tx .t{font-size:15px;font-weight:600;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx .m{font-size:11px;line-height:16px;color:var(--g07);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .qty{display:flex;align-items:baseline;gap:3px;white-space:nowrap}
.row .qty b{font-size:18px;font-weight:700;line-height:26px}
.row .qty span{font-size:11px;color:var(--g07)}
.list{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}

.scanbar{height:56px;border-radius:var(--r-lg);background:var(--g00);border:2px solid var(--green);display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;color:var(--green-dark)}
.scanbar .ph{flex:1;font-size:15px;font-weight:500;color:var(--g06)}
.scanbar .btn{height:44px;width:72px;padding:0}
.hint{background:var(--g02);border-radius:var(--r-md);padding:8px 12px;font-size:11px;font-weight:500;line-height:16px;color:var(--g07)}
.search{height:44px;border-radius:var(--r-lg);background:var(--g00);border:1px solid var(--g03);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--g06);font-size:13px;font-weight:500}
.search svg{width:18px;height:18px}
.label-row{display:flex;align-items:center;padding-top:4px}
.label-row .l{flex:1;font-size:12px;font-weight:500;color:var(--g08)}
.label-row .r{font-size:11px;color:var(--g07)}

.seg{display:flex;gap:4px;padding:4px;background:var(--g02);border-radius:var(--r-lg)}
.seg button{flex:1;padding:10px;border-radius:var(--r-md);font-size:13px;font-weight:500;color:var(--g07)}
.seg button.on{background:var(--g00);color:var(--g10);font-weight:700;box-shadow:var(--sh-sm)}
.select{height:36px;border-radius:var(--r-lg);background:var(--g00);border:1.5px solid var(--g04);display:flex;align-items:center;gap:4px;padding:0 8px 0 12px;font-size:13px;font-weight:500;flex:1;min-width:0}
.select span{flex:1}
.select svg{width:18px;height:18px;color:var(--g07)}
.summary{display:flex;align-items:center}
.summary .l{flex:1;font-size:12px;font-weight:500;color:var(--g07)}
.summary .btn{height:36px;width:96px;padding:0}

.loc-card{height:64px;padding:0 14px;display:flex;align-items:center;gap:8px;text-align:left}
.loc-card .tx{flex:1}
.loc-card .c{font-size:16px;font-weight:700;line-height:22px}
.loc-card .w{font-size:11px;line-height:16px;color:var(--g07);margin-top:3px}
.loc-card .n{font-size:12px;font-weight:700;color:var(--g08)}
.loc-card .n.zero{color:var(--g05)}

.step{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.step .hd{display:flex;align-items:center;gap:8px}
.step .num{width:24px;height:24px;border-radius:999px;background:var(--g03);color:var(--g07);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step.on .num{background:var(--green-dark);color:#fff}
.step .hd h4{font-size:15px;font-weight:600;line-height:22px}
.step .select{flex:none;height:48px;font-size:14px;padding:0 10px 0 14px}
.step .select svg{width:20px;height:20px}
.step .d{font-size:11px;line-height:16px;color:var(--g06)}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.empty .circ{width:64px;height:64px;border-radius:999px;background:var(--g02);color:var(--g06);display:flex;align-items:center;justify-content:center}
.empty .circ svg{width:28px;height:28px}
.empty h4{font-size:15px;font-weight:700;line-height:22px;color:var(--g08)}
.empty p{font-size:13px;line-height:19px;color:var(--g06)}

/* 홈 */
.home-head{height:64px;flex:none;background:var(--nav);color:#fff;display:flex;align-items:center;padding:0 16px;justify-content:space-between}
.home-head .sp{width:42px}
.home-head .c{text-align:center}
.home-head .c h2{font-size:18px;font-weight:700;line-height:26px}
.home-head .c p{font-size:11px;line-height:16px;color:rgba(255,255,255,.7)}
.today{background:var(--green-dark);color:#fff;border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.today .top{display:flex;align-items:center}
.today .top .t{flex:1}
.today .top h3{font-size:18px;font-weight:700;line-height:26px}
.today .top p{font-size:11px;line-height:16px;color:rgba(255,255,255,.75)}
.today .rem{background:rgba(255,255,255,.16);border-radius:var(--r-pill);padding:5px 10px;font-size:12px;font-weight:700;line-height:18px}
.today .stats{display:flex;gap:8px}
.today .stat{flex:1;background:rgba(255,255,255,.12);border-radius:var(--r-md);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.today .stat .l{font-size:11px;font-weight:700;color:rgba(255,255,255,.8)}
.today .stat .n{display:flex;align-items:baseline;gap:2px}
.today .stat b{font-size:24px;font-weight:700;line-height:28px}
.today .stat span{font-size:12px;font-weight:500;color:rgba(255,255,255,.75)}
.today .stat.hi{background:var(--g00);color:var(--g10)}
.today .stat.hi .l{color:var(--g08)}
.today .stat.hi b{color:var(--green-dark)}
.today .stat.hi span{color:var(--g06)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* 로그인 */
.login{background:var(--g00);align-items:center}
.login .brand{padding:120px 0 48px;text-align:center}
.login .brand h1{font-size:30px;font-weight:700;line-height:38px;color:var(--green-dark)}
.login .brand p{font-size:13px;line-height:19px;color:var(--g07);margin-top:10px}
.login form{width:100%;padding:0 24px;display:flex;flex-direction:column;gap:16px}
.login .ft{padding-top:40px;text-align:center;font-size:11px;line-height:16px;color:var(--g06);display:flex;flex-direction:column;gap:4px}

/* 피킹리스트 진입행 */
.pick-entry{padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.pick-entry .ibox{width:40px;height:40px;border-radius:var(--r-md);background:var(--t-green);color:var(--green-dark);display:flex;align-items:center;justify-content:center;flex:none}
.pick-entry .tx{flex:1}
.pick-entry .t{font-size:16px;font-weight:700;line-height:22px}
.pick-entry .m{font-size:11px;line-height:16px;color:var(--g07);margin-top:3px}
.pick-entry .chev{width:24px;height:24px;color:var(--g07);transform:rotate(180deg)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></symbol>

</svg>

<div class="shell">
  <aside class="side">
    <h1>맑은물에 PDA 입출고</h1>
    <p class="sub">리디자인 시안 · 480×800 · 2026-11-16</p>
    <div class="mode"><button class="on" data-mode="single">한 화면씩</button><button data-mode="all">모아보기</button></div>
    <div class="group">화면</div>
    <nav id="nav"></nav>
    <p class="foot">맑은물에 Green 토큰(브랜드 그린 1색 + 중립 회색) · Pretendard · 카드 R8 · 8pt 그리드. 화면 속 숫자는 예시입니다.</p>
  </aside>
  <main class="stage single" id="stage">
    <div class="device" id="device"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<template id="screens">

<section class="screen login" data-id="01" data-title="로그인">
  <div class="brand"><h1>맑은물에</h1><p>PDA 물류관리 · 싱크웍스</p></div>

<script>
(function(){
  const tpl=document.getElementById('screens').content;
  const screens=[...tpl.querySelectorAll('.screen')];
  const device=document.getElementById('device'), nav=document.getElementById('nav'), grid=document.getElementById('grid'), stage=document.getElementById('stage');
  screens.forEach(s=>{
    device.appendChild(s.cloneNode(true));
    const b=document.createElement('button'); b.innerHTML='<b>'+s.dataset.id+'</b>'+s.dataset.title; b.dataset.id=s.dataset.id; b.onclick=()=>show(s.dataset.id); nav.appendChild(b);
    const fig=document.createElement('figure'); const th=document.createElement('div'); th.className='thumb'; const c=s.cloneNode(true); c.classList.add('on'); th.appendChild(c); th.onclick=()=>{setMode('single');show(s.dataset.id)}; fig.appendChild(th); const cap=document.createElement('figcaption'); cap.textContent=s.dataset.id+' '+s.dataset.title; fig.appendChild(cap); grid.appendChild(fig);
  });
  function fitThumbs(){ grid.querySelectorAll('.thumb').forEach(t=>{ const k=t.clientWidth/480; t.querySelector('.screen').style.transform='scale('+k+')'; }); }
  function show(id){ device.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.dataset.id===id)); nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===id)); location.hash=id; }
  function setMode(m){ stage.classList.toggle('single',m==='single'); stage.classList.toggle('all',m==='all'); document.querySelectorAll('.mode button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m)); if(m==='all') requestAnimationFrame(fitThumbs); }
  document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  device.addEventListener('click',e=>{ const g=e.target.closest('[data-go]'); if(g) show(g.dataset.go); });
  window.addEventListener('resize',()=>{ if(stage.classList.contains('all')) fitThumbs(); });
  window.addEventListener('hashchange',()=>{ const id=location.hash.slice(1); if(device.querySelector('.screen[data-id="'+id+'"]')) show(id); });
  show((location.hash||'#01').slice(1));
})();
</script>
