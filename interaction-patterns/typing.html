<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>타이핑 효과</title>
<link rel="stylesheet" href="shared.css">
<style>
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; }
  h1 { font-size:clamp(1.8rem,5vw,3.5rem); font-weight:700; }
  .typed { color:var(--accent); }
  .caret { display:inline-block; width:3px; height:1em; background:var(--fg); vertical-align:-0.12em; margin-left:2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
</style>
</head>
<body>
<div class="demo-bar"><a href="index.html">← 목록</a><span class="t">타이핑 효과 — 쓰고, 지우고, 다음 문구로</span></div>
<main>
  <h1>저는 <span class="typed" id="typed"></span><span class="caret"></span></h1>
</main>
<script>
const PHRASES = ['UI/UX 디자이너입니다', 'IT 기획자입니다', '교수입니다', '크리에이터입니다'];
const el = document.getElementById('typed');
let pi = 0, ci = 0, deleting = false;
(function tick(){
  const word = PHRASES[pi];
  el.textContent = word.slice(0, ci);
  let delay = deleting ? 45 : 95 + Math.random()*60;   // 사람 손맛: 랜덤 딜레이
  if (!deleting && ci === word.length) { deleting = true; delay = 1600; }
  else if (deleting && ci === 0) { deleting = false; pi = (pi+1) % PHRASES.length; delay = 400; }
  else ci += deleting ? -1 : 1;
  setTimeout(tick, delay);
})();
</script>
</body>
</html>
